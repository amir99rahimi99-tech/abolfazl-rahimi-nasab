<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ابوالفضل رحیمی نسب</title>

  <!-- Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    h1 {
      text-align: center;
      padding: 25px 10px;
    }

    .tether-box {
      width: calc(100% - 30px);
      max-width: 600px;
      margin: 0 auto 25px;
      padding: 20px;
      box-sizing: border-box;
      background: #151d35;
      border: 1px solid #283657;
      border-radius: 15px;
      text-align: center;
    }

    .tether-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #usdt-price {
      font-size: 28px;
      font-weight: bold;
    }

    #update-time {
      margin-top: 8px;
      font-size: 12px;
      color: #9ca8c7;
    }

    .error {
      color: #ff7070;
      font-size: 14px;
    }

    /* چارت USDT/IRT */
    .usdt-chart-box {
      width: calc(100% - 30px);
      max-width: 1200px;
      margin: 20px auto;
      background: #111827;
      border: 1px solid #283657;
      border-radius: 15px;
      overflow: hidden;
    }

    .chart-title {
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #usdt-chart {
      width: 100%;
      height: 500px;
    }

    /* TradingView */
    .chart {
      width: 100%;
      height: 700px;
      margin-top: 30px;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <h1>به سایت ابوالفضل رحیمی نسب خوش آمدید</h1>


  <!-- قیمت لحظه‌ای تتر -->
  <div class="tether-box">

    <div class="tether-title">
      💵 قیمت تتر نوبیتکس
    </div>

    <div id="usdt-price">
      در حال دریافت قیمت...
    </div>

    <div id="update-time">
      ---
    </div>

  </div>


  <!-- چارت یک ساعته تتر -->
  <div class="usdt-chart-box">

    <div class="chart-title">
      📊 چارت یک ساعته USDT / IRT نوبیتکس
    </div>

    <div id="usdt-chart"></div>

  </div>


  <!-- TradingView -->
  <div class="chart">

    <div class="tradingview-widget-container">

      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
        async>
      {
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "allow_symbol_change": true,
        "calendar": false,
        "support_host": "https://www.tradingview.com"
      }
      </script>

    </div>

  </div>


  <script>

    /* =====================================
       ساخت چارت
    ===================================== */

    const chartContainer =
      document.getElementById("usdt-chart");

    const chart =
      LightweightCharts.createChart(chartContainer, {

        layout: {
          background: {
            color: "#111827"
          },
          textColor: "#d1d5db"
        },

        grid: {
          vertLines: {
            color: "#1f2937"
          },
          horzLines: {
            color: "#1f2937"
          }
        },

        rightPriceScale: {
          borderColor: "#374151"
        },

        timeScale: {
          borderColor: "#374151",
          timeVisible: true,
          secondsVisible: false
        },

        localization: {

          timeFormatter: function(time) {

            const date = new Date(time * 1000);

            return date.toLocaleTimeString(
              "fa-IR",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );

          }

        }

      });


    const candleSeries =
      chart.addCandlestickSeries({

        upColor: "#26a69a",
        downColor: "#ef5350",

        borderUpColor: "#26a69a",
        borderDownColor: "#ef5350",

        wickUpColor: "#26a69a",
        wickDownColor: "#ef5350"

      });


    /* =====================================
       کندل‌های ذخیره شده
    ===================================== */

    let candles = [];

    try {

      candles =
        JSON.parse(
          localStorage.getItem(
            "usdtirt_h1_candles"
          ) || "[]"
        );

    } catch (e) {

      candles = [];

    }


    if (candles.length > 0) {

      candleSeries.setData(candles);

    }


    /* =====================================
       گرفتن قیمت نوبیتکس
    ===================================== */

    async function updateUSDT() {

      const priceElement =
        document.getElementById("usdt-price");

      const timeElement =
        document.getElementById("update-time");


      try {

        const response =
          await fetch(
            "https://apiv2.nobitex.ir/market/stats?srcCurrency=usdt&dstCurrency=rls"
          );


        if (!response.ok) {

          throw new Error("API Error");

        }


        const data =
          await response.json();


        const market =
          data.stats["usdt-rls"];


        if (!market) {

          throw new Error(
            "USDT market not found"
          );

        }


        const price =
          Number(market.latest);


        /* قیمت بالای صفحه */

        priceElement.textContent =
          price.toLocaleString("fa-IR") +
          " ریال";


        timeElement.textContent =
          "آخرین معامله: " +
          new Date().toLocaleTimeString(
            "fa-IR"
          );


        /* =================================
           ساعت محلی دستگاه
        ================================= */

        const now =
          new Date();


        const year =
          now.getFullYear();


        const month =
          now.getMonth();


        const day =
          now.getDate();


        const localHour =
          now.getHours();


        /*
          شناسه هر کندل:

          مثال:

          20:00
          21:00
          22:00
          23:00
        */

        const hourKey =
          year +
          "-" +
          month +
          "-" +
          day +
          "-" +
          localHour;


        /* =================================
           زمان نمایشی کندل
        ================================= */

        const candleTime =
          Math.floor(
            Date.UTC(
              year,
              month,
              day,
              localHour,
              0,
              0
            ) / 1000
          );


        /* =================================
           کندل قبلی
        ================================= */

        let current =
          candles[candles.length - 1];


        /* =================================
           اگر کندل جدید است
        ================================= */

        if (
          !current ||
          current.hourKey !== hourKey
        ) {

          const newCandle = {

            time: candleTime,

            open: price,

            high: price,

            low: price,

            close: price,

            hourKey: hourKey

          };


          candles.push(
            newCandle
          );


          candleSeries.update(
            newCandle
          );

        }


        /* =================================
           اگر همان کندل است
        ================================= */

        else {

          current.high =
            Math.max(
              current.high,
              price
            );


          current.low =
            Math.min(
              current.low,
              price
            );


          current.close =
            price;


          candleSeries.update(
            current
          );

        }


        /* =================================
           ذخیره کندل‌ها
        ================================= */

        localStorage.setItem(
          "usdtirt_h1_candles",
          JSON.stringify(candles)
        );


      } catch (error) {

        console.error(error);


        priceElement.innerHTML =
          '<span class="error">خطا در دریافت قیمت</span>';


        timeElement.textContent =
          "اتصال به نوبیتکس برقرار نشد";

      }

    }


    /* =====================================
       اجرای اولیه
    ===================================== */

    updateUSDT();


    /* =====================================
       بروزرسانی هر ۳۰ ثانیه
    ===================================== */

    setInterval(
      updateUSDT,
      30000
    );


    /* =====================================
       تغییر اندازه صفحه
    ===================================== */

    window.addEventListener(
      "resize",
      function() {

        chart.applyOptions({

          width:
            chartContainer.clientWidth

        });

      }
    );


  </script>

</body>
</html>
