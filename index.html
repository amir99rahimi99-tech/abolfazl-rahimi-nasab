<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ابوالفضل رحیمی نسب</title>

  <style>
    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    h1 {
      text-align: center;
      padding: 25px 10px;
    }

    /* قیمت تتر */
    .tether-box {
      width: calc(100% - 30px);
      max-width: 600px;
      margin: 0 auto 25px;
      padding: 20px;
      box-sizing: border-box;
      background: #151d35;
      border: 1px solid #283657;
      border-radius: 15px;
      text-align: center;
    }

    .tether-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #usdt-price {
      font-size: 28px;
      font-weight: bold;
    }

    #update-time {
      margin-top: 8px;
      font-size: 12px;
      color: #9ca8c7;
    }

    .error {
      color: #ff7070;
      font-size: 14px;
    }

    /* TradingView */
    .chart {
      width: 100%;
      height: 700px;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <h1>به سایت ابوالفضل رحیمی نسب خوش آمدید</h1>

  <!-- قیمت تتر نوبیتکس -->
  <div class="tether-box">

    <div class="tether-title">
      💵 قیمت تتر نوبیتکس
    </div>

    <div id="usdt-price">
      در حال دریافت قیمت...
    </div>

    <div id="update-time">
      ---
    </div>

  </div>


  <!-- TradingView -->
  <div class="chart">

    <div class="tradingview-widget-container">

      <div class="tradingview-widget-container__widget"></div>

      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
        async>
      {
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "allow_symbol_change": true,
        "calendar": false,
        "support_host": "https://www.tradingview.com"
      }
      </script>

    </div>

  </div>


  <!-- دریافت قیمت تتر -->
  <script>

    async function getUSDTPrice() {

      const priceElement =
        document.getElementById("usdt-price");

      const timeElement =
        document.getElementById("update-time");

      try {

        const response = await fetch(
          "https://apiv2.nobitex.ir/market/stats?srcCurrency=usdt&dstCurrency=rls"
        );

        if (!response.ok) {
          throw new Error("API Error");
        }

        const data = await response.json();

        const market = data.stats["usdt-rls"];

        if (!market) {
          throw new Error("USDT market not found");
        }

        const price = Number(market.latest);

        priceElement.textContent =
          price.toLocaleString("fa-IR") + " ریال";

        timeElement.textContent =
          "آخرین معامله: " +
          new Date().toLocaleTimeString("fa-IR");

      } catch (error) {

        console.error(error);

        priceElement.innerHTML =
          '<span class="error">خطا در دریافت قیمت</span>';

        timeElement.textContent =
          "اتصال به نوبیتکس برقرار نشد";

      }

    }

    // بار اول
    getUSDTPrice();

    // هر 30 ثانیه
    setInterval(getUSDTPrice, 30000);

  </script>

</body>
</html>
