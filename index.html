<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ابوالفضل رحیمی نسب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      padding: 35px 0;
    }

    .welcome {
      text-align: center;
      font-size: clamp(25px, 5vw, 45px);
      margin: 20px 0 35px;
    }

    .box {
      background: #11182d;
      border: 1px solid #ffffff18;
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 15px 40px #0005;
    }

    .title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .price {
      text-align: center;
      font-size: clamp(30px, 7vw, 50px);
      font-weight: bold;
      direction: rtl;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      color: #9ca7c7;
      font-size: 13px;
    }

    .chart {
      width: 100%;
      height: 650px;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .box {
        padding: 15px;
      }

      .chart {
        height: 500px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- متن خوش آمدگویی -->
    <h1 class="welcome">
      به سایت ابوالفضل رحیمی نسب خوش آمدید
    </h1>


    <!-- قیمت لحظه ای تتر -->
    <div class="box">

      <div class="title">
        💵 قیمت لحظه‌ای تتر
      </div>

      <div id="usdtPrice" class="price">
        در حال دریافت...
      </div>

      <div id="status" class="status">
        در حال اتصال به نوبیتکس...
      </div>

    </div>


    <!-- نمودار TradingView -->
    <div class="box">

      <div class="title">
        📈 نمودار لحظه‌ای BTC/USDT
      </div>

      <div class="chart">

        <div class="tradingview-widget-container">

          <div class="tradingview-widget-container__widget"></div>

          <script
            type="text/javascript"
            src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
            async>
          {
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "calendar": false,
            "support_host": "https://www.tradingview.com"
          }
          </script>

        </div>

      </div>

    </div>

  </div>


  <script>

    async function getTetherPrice() {

      const price = document.getElementById("usdtPrice");
      const status = document.getElementById("status");

      try {

        const response = await fetch(
          "https://api.nobitex.ir/v2/orderbook/USDTIRT"
        );

        if (!response.ok) {
          throw new Error("API Error");
        }

        const data = await response.json();

        const rialPrice = Number(data.lastTradePrice);

        if (!rialPrice) {
          throw new Error("Price not found");
        }

        const tomanPrice = Math.round(rialPrice / 10);

        price.textContent =
          tomanPrice.toLocaleString("fa-IR") + " تومان";

        status.textContent =
          "● قیمت از نوبیتکس";

      } catch (error) {

        price.textContent = "قیمت دریافت نشد";

        status.textContent =
          "اتصال به نوبیتکس برقرار نشد";

      }
    }

    getTetherPrice();

    setInterval(getTetherPrice, 10000);

  </script>

</body>
</html>
