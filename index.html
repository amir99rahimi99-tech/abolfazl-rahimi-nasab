<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازارک | سایت آگهی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f6f6f6;color:#252525}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.nav{max-width:1180px;margin:auto;min-height:68px;display:flex;align-items:center;gap:18px;padding:0 16px}
.logo{font-weight:900;font-size:23px;color:#e91e3a;white-space:nowrap}.search{flex:1;display:flex;background:#f1f1f1;border-radius:10px;overflow:hidden}.search input{border:0;background:transparent;padding:13px;outline:0;width:100%}.search button{border:0;background:transparent;padding:0 14px}
.navbtn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px 13px}.primary{background:#e91e3a;color:white;border:0}
.container{max-width:1180px;margin:auto;padding:18px 16px}.hero{background:#fff;border-radius:16px;padding:24px;margin-bottom:18px;border:1px solid #eee}
.hero h1{margin:0 0 8px}.muted{color:#777;font-size:13px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chip{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:22px;padding:8px 13px}.chip.active{background:#252525;color:#fff;border-color:#252525}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.panel{background:#fff;border:1px solid #eee;border-radius:14px;padding:16px;height:max-content}.panel h3{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px;outline:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #eee;border-radius:13px;overflow:hidden;position:relative}.pic{height:170px;background:#eee;display:grid;place-items:center;font-size:45px}.cardbody{padding:12px}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:900;margin-top:10px}.meta{color:#888;font-size:11px;margin-top:7px}.fav{position:absolute;top:8px;left:8px;width:36px;height:36px;border:0;border-radius:50%;background:#ffffffdd}
.empty{text-align:center;padding:45px;color:#777}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:center;justify-content:center;padding:16px}.box{background:white;border-radius:16px;width:min(700px,100%);max-height:90vh;overflow:auto;padding:20px}.boxhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px 14px}.btn.primary{background:#e91e3a;border-color:#e91e3a;color:white}.notice{padding:10px;border-radius:9px;background:#f8f8f8;margin:10px 0;font-size:13px}
.tabs{display:flex;gap:6px;border-bottom:1px solid #eee;margin-bottom:15px}.tab{border:0;background:transparent;padding:10px}.tab.active{border-bottom:2px solid #e91e3a;color:#e91e3a}.listrow{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
footer{text-align:center;padding:35px;color:#888;font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.nav{flex-wrap:wrap;padding-bottom:10px}.search{order:3;flex-basis:100%}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:200px}}
</style>
</head>
<body>
<header class="top"><div class="nav">
<div class="logo">بازارک</div>
<div class="search"><input id="q" placeholder="جستجوی آگهی، کالا، خودرو، ملک..."><button onclick="render()">🔎</button></div>
<button class="navbtn" onclick="openAccount()">حساب من</button>
<button class="navbtn primary" onclick="openPost()">＋ ثبت آگهی</button>
</div></header>

<main class="container">
<section class="hero">
<h1>خرید و فروش آسان</h1><div class="muted">آگهی‌های نزدیک خودت را پیدا کن یا آگهی جدید ثبت کن.</div>
<div class="chips" id="cats"></div>
</section>

<div class="layout">
<aside class="panel">
<h3>فیلتر آگهی‌ها</h3>
<div class="field"><label>شهر</label><select id="city" onchange="render()"><option value="">همه شهرها</option><option>تهران</option><option>کرج</option><option>مشهد</option><option>اصفهان</option><option>شیراز</option><option>تبریز</option></select></div>
<div class="field"><label>حداقل قیمت</label><input id="min" type="number" oninput="render()" placeholder="مثلاً 1000000"></div>
<div class="field"><label>حداکثر قیمت</label><input id="max" type="number" oninput="render()" placeholder="مثلاً 50000000"></div>
<div class="field"><label>مرتب‌سازی</label><select id="sort" onchange="render()"><option value="new">جدیدترین</option><option value="cheap">ارزان‌ترین</option><option value="expensive">گران‌ترین</option></select></div>
<button class="btn" style="width:100%" onclick="resetFilters()">پاک کردن فیلترها</button>
</aside>
<section><div id="resultInfo" class="muted" style="margin-bottom:10px"></div><div class="grid" id="grid"></div></section>
</div>
</main>

<footer>بازارک — نمونه اولیه سیستم آگهی. برای استفاده عمومی، احراز هویت و پایگاه‌داده واقعی باید در مرحله بک‌اند اضافه شود.</footer>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const KEY='bazaar_ads_v1', FAV='bazaar_favs_v1', USER='bazaar_user_v1', MSG='bazaar_msgs_v1';
const categories=['همه','املاک','خودرو','کالای دیجیتال','خانه و آشپزخانه','موبایل','لوازم شخصی','استخدام','خدمات','سرگرمی'];
let cat='همه';
const seed=[
{id:1,title:'آیفون ۱۳ ۱۲۸ گیگ',price:35000000,city:'تهران',cat:'موبایل',desc:'تمیز و سالم، بدون ضربه، همراه جعبه.',seller:'علی',time:'امروز',icon:'📱'},
{id:2,title:'لپ‌تاپ Dell Latitude',price:28000000,city:'کرج',cat:'کالای دیجیتال',desc:'Core i5، رم ۸ گیگ، SSD.',seller:'رضا',time:'امروز',icon:'💻'},
{id:3,title:'پژو ۲۰۶ تیپ ۲',price:620000000,city:'تهران',cat:'خودرو',desc:'مدل تمیز، کارکرد مناسب.',seller:'محمد',time:'امروز',icon:'🚗'},
{id:4,title:'آپارتمان ۸۰ متری',price:4500000000,city:'مشهد',cat:'املاک',desc:'دو خوابه، خوش نقشه.',seller:'سارا',time:'دیروز',icon:'🏠'},
{id:5,title:'مبل هفت نفره',price:18000000,city:'اصفهان',cat:'خانه و آشپزخانه',desc:'تمیز و کم‌کارکرد.',seller:'مریم',time:'دیروز',icon:'🛋️'},
{id:6,title:'دوربین Canon',price:42000000,city:'شیراز',cat:'کالای دیجیتال',desc:'دوربین سالم با لنز.',seller:'نوید',time:'۲ روز پیش',icon:'📷'},
{id:7,title:'استخدام فروشنده',price:0,city:'تبریز',cat:'استخدام',desc:'نیروی فروش تمام‌وقت.',seller:'شرکت آریا',time:'۲ روز پیش',icon:'💼'},
{id:8,title:'دوچرخه کوهستان',price:12500000,city:'کرج',cat:'سرگرمی',desc:'سالم و آماده استفاده.',seller:'امیر',time:'۳ روز پیش',icon:'🚲'}
];
let ads=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function money(n){return n?new Intl.NumberFormat('fa-IR').format(n)+' تومان':'توافقی'}
function save(){localStorage.setItem(KEY,JSON.stringify(ads))}
function renderCats(){document.getElementById('cats').innerHTML=categories.map(x=>`<button class="chip ${x===cat?'active':''}" onclick="cat='${x}';render()">${x}</button>`).join('')}
function render(){
 renderCats();
 let q=(document.getElementById('q').value||'').trim().toLowerCase(),city=document.getElementById('city').value;
 let min=+document.getElementById('min').value||0,max=+document.getElementById('max').value||Infinity;
 let a=ads.filter(x=>(cat==='همه'||x.cat===cat)&&(!city||x.city===city)&&(x.price===0||x.price>=min)&&(x.price===0||x.price<=max)&&(!q||[x.title,x.desc,x.cat,x.city].join(' ').toLowerCase().includes(q)));
 let s=document.getElementById('sort').value;if(s==='cheap')a.sort((x,y)=>(x.price||Infinity)-(y.price||Infinity));if(s==='expensive')a.sort((x,y)=>(y.price||0)-(x.price||0));
 document.getElementById('resultInfo').textContent=`${a.length.toLocaleString('fa-IR')} آگهی`;
 let fav=JSON.parse(localStorage.getItem(FAV)||'[]');
 document.getElementById('grid').innerHTML=a.length?a.map(x=>`<article class="card"><button class="fav" onclick="toggleFav(${x.id})">${fav.includes(x.id)?'❤️':'♡'}</button><div class="pic">${x.icon||'📦'}</div><div class="cardbody" onclick="openAd(${x.id})"><div class="title">${esc(x.title)}</div><div class="price">${money(x.price)}</div><div class="meta">${esc(x.city)} · ${esc(x.time)} · ${esc(x.cat)}</div></div></article>`).join(''):`<div class="empty">آگهی‌ای با این فیلتر پیدا نشد.</div>`;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openAd(id){let x=ads.find(a=>a.id===id);openModal(`<div class="boxhead"><h2>${esc(x.title)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="pic" style="height:240px;margin:12px 0">${x.icon||'📦'}</div><div class="price">${money(x.price)}</div><p>${esc(x.desc)}</p><div class="notice">📍 ${esc(x.city)} · دسته: ${esc(x.cat)} · فروشنده: ${esc(x.seller)}</div><div class="actions"><button class="btn primary" onclick="sendMsg(${x.id})">💬 ارسال پیام</button><button class="btn" onclick="toggleFav(${x.id});closeModal()">❤️ علاقه‌مندی</button><button class="btn" onclick="reportAd(${x.id})">⚑ گزارش</button></div>`)}
function openPost(){openModal(`<div class="boxhead"><h2>ثبت آگهی جدید</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>عنوان آگهی</label><input id="pt" placeholder="مثلاً گوشی آیفون ۱۳"></div><div class="field"><label>دسته‌بندی</label><select id="pc">${categories.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>شهر</label><select id="pcity">${['تهران','کرج','مشهد','اصفهان','شیراز','تبریز'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>قیمت (تومان)</label><input id="pp" type="number" placeholder="خالی = توافقی"></div><div class="field"><label>توضیحات</label><textarea id="pd" rows="5" placeholder="توضیحات کامل آگهی"></textarea></div><div class="field"><label>نام فروشنده</label><input id="ps" placeholder="نام شما"></div><button class="btn primary" style="width:100%" onclick="postAd()">انتشار آگهی</button>`)}
function postAd(){let t=document.getElementById('pt').value.trim(),d=document.getElementById('pd').value.trim(),s=document.getElementById('ps').value.trim();if(!t||!d||!s)return alert('عنوان، توضیحات و نام فروشنده را کامل کنید');ads.unshift({id:Date.now(),title:t,cat:document.getElementById('pc').value,city:document.getElementById('pcity').value,price:+document.getElementById('pp').value||0,desc:d,seller:s,time:'همین الان',icon:'📦',owner:true});save();closeModal();render();alert('آگهی با موفقیت ثبت شد.')}
function toggleFav(id){let a=JSON.parse(localStorage.getItem(FAV)||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem(FAV,JSON.stringify(a));render()}
function openAccount(){let u=JSON.parse(localStorage.getItem(USER)||'null');openModal(`<div class="boxhead"><h2>حساب من</h2><button class="close" onclick="closeModal()">×</button></div>${u?`<div class="notice">سلام ${esc(u.name)} 👋</div><div class="tabs"><button class="tab active" onclick="accountTab('ads')">آگهی‌های من</button><button class="tab" onclick="accountTab('fav')">علاقه‌مندی‌ها</button><button class="tab" onclick="accountTab('msg')">پیام‌ها</button></div><div id="accountContent"></div>`:`<div class="field"><label>نام</label><input id="un" placeholder="نام و نام خانوادگی"></div><div class="field"><label>شماره موبایل</label><input id="up" placeholder="09..."></div><button class="btn primary" style="width:100%" onclick="login()">ورود / ساخت حساب</button>`}`);if(u)accountTab('ads')}
function login(){let name=document.getElementById('un').value.trim(),phone=document.getElementById('up').value.trim();if(!name||!phone)return alert('نام و شماره را وارد کنید');localStorage.setItem(USER,JSON.stringify({name,phone}));openAccount()}
function accountTab(t){let el=document.getElementById('accountContent');if(t==='ads'){let mine=ads.filter(x=>x.owner);el.innerHTML=mine.length?mine.map(x=>`<div class="listrow"><span>${esc(x.title)}<br><small>${money(x.price)}</small></span><button class="btn" onclick="deleteAd(${x.id})">حذف</button></div>`).join(''):'آگهی ثبت‌شده‌ای ندارید.'}if(t==='fav'){let f=JSON.parse(localStorage.getItem(FAV)||'[]');el.innerHTML=ads.filter(x=>f.includes(x.id)).map(x=>`<div class="listrow">${esc(x.title)}<span>${money(x.price)}</span></div>`).join('')||'موردی ندارید.'}if(t==='msg'){let m=JSON.parse(localStorage.getItem(MSG)||'[]');el.innerHTML=m.map(x=>`<div class="listrow"><span>آگهی #${x.adId}<br>${esc(x.text)}</span></div>`).join('')||'پیامی ندارید.'}}
function deleteAd(id){ads=ads.filter(x=>x.id!==id);save();openAccount();render()}
function sendMsg(id){let u=JSON.parse(localStorage.getItem(USER)||'null');if(!u){closeModal();openAccount();return}openModal(`<div class="boxhead"><h2>ارسال پیام</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><textarea id="mt" rows="5" placeholder="سلام، هنوز موجوده؟"></textarea></div><button class="btn primary" style="width:100%" onclick="saveMsg(${id})">ارسال</button>`)}
function saveMsg(id){let text=document.getElementById('mt').value.trim();if(!text)return;let m=JSON.parse(localStorage.getItem(MSG)||'[]');m.unshift({adId:id,text});localStorage.setItem(MSG,JSON.stringify(m));closeModal();alert('پیام ذخیره شد.')}
function reportAd(id){alert('گزارش آگهی ثبت شد. در نسخه بک‌اند این گزارش به پنل مدیریت ارسال می‌شود.')}
function resetFilters(){['city','min','max'].forEach(x=>document.getElementById(x).value='');document.getElementById('sort').value='new';document.getElementById('q').value='';cat='همه';render()}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});render();
</script>
</body></html>
